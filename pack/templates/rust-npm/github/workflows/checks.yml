name: Checks

# The single source of truth for "is this tree good?". Called by ci.yml on
# every push/PR and by release.yml before it publishes anything, so the
# release gate cannot drift from CI.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # No toolchain action: rust-toolchain.toml is the single source of truth
      # for the version *and* the components, and rustup honours it over
      # `rustup default`.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Lint, docs, launcher, and version checks are OS-independent, so they
      # run on ubuntu only; the other platforms run the test suites.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Add --locked to the cargo steps once Cargo.lock is committed.
      - name: Test
        run: cargo nextest run --workspace

      - name: Doctests
        run: cargo test --doc --workspace

      - name: Docs (warnings as errors)
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Launcher test
        if: runner.os == 'Linux'
        run: node --test packages/{{superdev:project-slug}}/test/*.test.js

      - name: Version consistency
        if: runner.os == 'Linux'
        run: node scripts/verify-version.mjs

  deny:
    # Deterministic supply-chain checks only: these fail when *we* change
    # dependencies. Advisories are handled by audit.yml on a schedule so a new
    # RUSTSEC entry can never block an unrelated PR or an in-flight release.
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
