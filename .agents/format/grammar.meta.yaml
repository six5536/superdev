# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://ncoderz.com/superdev/superdev-grammar.meta.yaml
title: superdev grammar
description: The shape of superdev-grammar.yaml. validate-awa.mjs checks the grammar against this
  before it validates anything with it, so a typo in the grammar fails loudly instead of
  silently switching a rule off.
type: object
required:
  - grammar
  - version
  - doc
  - roots
  - conditions
  - tools
  - kinds
  - duplication
additionalProperties: false
properties:
  $schema:
    type: string
  grammar:
    const: superdev
  version:
    type: string
    minLength: 1
  doc:
    type: string
    minLength: 1
  roots:
    description: Where a bare run looks for files a kind claims.
    type: object
    required:
      - doc
      - paths
    additionalProperties: false
    properties:
      doc:
        type: string
        minLength: 1
      paths:
        type: array
        minItems: 1
        items:
          type: string
  conditions:
    description: The one condition attribute and the closed set of values it takes.
    type: object
    required:
      - attribute
      - doc
      - pattern
      - forms
    additionalProperties: false
    properties:
      attribute:
        type: string
        minLength: 1
      doc:
        type: string
      pattern:
        type: string
        format: regex
      forms:
        type: array
        minItems: 1
        items:
          type: string
      renamedFrom:
        description: Attribute names the grammar has retired, mapped to the message shown when one turns up.
        type: object
        patternProperties:
          ^[a-z][a-z0-9-]*$:
            type: string
            minLength: 1
        additionalProperties: false
  tools:
    type: object
    required:
      - doc
      - roster
      - enforceOnToolCall
    additionalProperties: false
    properties:
      doc:
        type: string
      roster:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      enforceOnToolCall:
        type: boolean
  kinds:
    type: object
    required:
      - unit
      - schema
      - core
    additionalProperties: false
    properties:
      unit:
        $ref: "#/$defs/unitKind"
      schema:
        $ref: "#/$defs/schemaKind"
      core:
        $ref: "#/$defs/coreKind"
  duplication:
    type: object
    required:
      - doc
      - minTokens
      - threshold
      - withinFileKinds
      - crossPairs
      - exemptCrossUnitElements
      - skeletonConstants
      - stopWords
    additionalProperties: false
    properties:
      doc:
        type: string
      minTokens:
        type: integer
        minimum: 1
      threshold:
        type: number
        minimum: 0
      withinFileKinds:
        type: array
        items:
          enum:
            - unit
            - schema
            - core
      crossPairs:
        type: array
        items:
          type: string
          pattern: ^(unit|schema|core)\|(unit|schema|core)$
      exemptCrossUnitElements:
        type: array
        items:
          type: string
      exemptCrossUnitReason:
        type: string
      skeletonConstants:
        type: array
        items:
          type: string
      stopWords:
        type: array
        minItems: 1
        items:
          type: string
$defs:
  match:
    description: "How a filename maps to this kind. Exactly one kind may carry default: true."
    type: object
    additionalProperties: false
    properties:
      basename:
        type: array
        items:
          type: string
      suffix:
        type: array
        items:
          type: string
      dir:
        description: Names of the immediate parent directory, the way AOKF lets a directory carry a
          concept's kind.
        type: array
        items:
          type: string
      except:
        description: >
          Filenames this kind does not govern even where its other rules would claim them. An
          AOKF directory index sits beside the concepts it lists without being one of them.
        type: array
        items:
          type: string
      default:
        type: boolean
  unitKind:
    type: object
    required:
      - doc
      - match
      - frontmatter
      - root
      - order
      - elements
      - checks
    additionalProperties: false
    properties:
      doc:
        type: string
      match:
        $ref: "#/$defs/match"
      frontmatter:
        description: The host's frontmatter contract for a unit file, not superdev's own vocabulary.
        type: object
        required:
          - doc
          - booleanValues
          - keys
          - profiles
        additionalProperties: false
        properties:
          doc:
            type: string
            minLength: 1
          booleanValues:
            type: array
            minItems: 2
            items:
              type: string
          keys:
            type: object
            minProperties: 1
            patternProperties:
              ^[a-z][a-z0-9-]*$:
                type: object
                required:
                  - type
                additionalProperties: false
                properties:
                  type:
                    enum:
                      - string
                      - boolean
                      - stringOrList
                      - map
                  doc:
                    type: string
                  enum:
                    type: array
                    minItems: 1
                    items:
                      type: string
                  pattern:
                    type: string
                    format: regex
                  maxLength:
                    type: integer
                    minimum: 1
                  portable:
                    type: boolean
            additionalProperties: false
          profiles:
            description: "Which key set and required keys apply, chosen by filename. Exactly one profile may
              carry default: true."
            type: array
            minItems: 1
            items:
              type: object
              required:
                - name
                - doc
                - required
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                doc:
                  type: string
                match:
                  $ref: "#/$defs/match"
                default:
                  type: boolean
                required:
                  type: array
                  items:
                    type: string
                allow:
                  type: array
                  minItems: 1
                  items:
                    type: string
                nameMatchesDirectory:
                  type: boolean
          portability:
            type: object
            required:
              - spec
              - url
              - warn
            additionalProperties: false
            properties:
              spec:
                type: string
              url:
                type: string
              warn:
                type: string
                minLength: 1
          mirrors:
            description: Frontmatter keys that must equal an element attribute.
            type: array
            items:
              type: object
              required:
                - key
                - element
                - attr
              additionalProperties: false
              properties:
                key:
                  type: string
                element:
                  type: string
                attr:
                  type: string
                basename:
                  type: string
      root:
        type: string
        minLength: 1
      order:
        type: array
        minItems: 1
        items:
          type: string
      removed:
        description: Tags the grammar has retired, mapped to the message shown when one turns up.
        type: object
        patternProperties:
          ^[a-z][a-z0-9_]*$:
            type: string
            minLength: 1
        additionalProperties: false
      elements:
        type: object
        minProperties: 1
        patternProperties:
          ^[a-z][a-z0-9_]*$:
            $ref: "#/$defs/element"
        additionalProperties: false
      checks:
        type: object
        required:
          - attributes-free-of-angle-brackets
          - steps-are-not-pure-loads
          - core-block-references
        additionalProperties: false
        properties:
          attributes-free-of-angle-brackets:
            $ref: "#/$defs/check"
          steps-are-not-pure-loads:
            allOf:
              - $ref: "#/$defs/check"
            required:
              - enabled
              - message
              - verbs
          core-block-references:
            allOf:
              - $ref: "#/$defs/check"
            required:
              - enabled
              - message
              - pattern
  element:
    type: object
    required:
      - doc
      - form
    additionalProperties: false
    properties:
      doc:
        type: string
        minLength: 1
      form:
        enum:
          - block
          - self-closing
          - either
      parent:
        description: >-
          The element this one must sit directly inside; a list when more than one parent
          is legal; null for the file root.
        type:
          - string
          - "null"
          - array
        items:
          type: string
      occurs:
        type: object
        required:
          - min
        additionalProperties: false
        properties:
          min:
            type: integer
            minimum: 0
          max:
            type: integer
            minimum: 0
      attrs:
        type: object
        patternProperties:
          ^[a-z][a-z0-9-]*$:
            $ref: "#/$defs/attr"
        additionalProperties: false
      bodyRequired:
        type: boolean
      selfClosingNeedsAttr:
        type: boolean
      bodyForbid:
        type: object
        required:
          - pattern
          - message
        additionalProperties: false
        properties:
          pattern:
            type: string
            format: regex
          flags:
            type: string
          message:
            type: string
            minLength: 1
      atMostOneOf:
        description: Attribute names, at most one of which may be present.
        type: array
        minItems: 2
        items:
          type: string
      exactlyOneOf:
        description: 'Exactly one must be present: "@attr" for an attribute, "body" for the element body.'
        type: array
        minItems: 2
        items:
          type: string
          pattern: ^(@[a-z][a-z0-9-]*|body)$
      mustContain:
        type: object
        required:
          - anyOf
        additionalProperties: false
        properties:
          anyOf:
            type: array
            minItems: 1
            items:
              type: string
          orPattern:
            type: string
            format: regex
      compare:
        description: How this element contributes a statement to the duplication check.
        type: object
        required:
          - parts
          - label
        additionalProperties: false
        properties:
          parts:
            type: array
            minItems: 1
            items:
              type: string
              pattern: ^(@[a-z][a-z0-9-]*|body)(\|(@[a-z][a-z0-9-]*|body))*$
          label:
            type: string
            minLength: 1
          skipIf:
            type: object
            required:
              - part
              - pattern
            additionalProperties: false
            properties:
              part:
                type: string
                pattern: ^(@[a-z][a-z0-9-]*|body)(\|(@[a-z][a-z0-9-]*|body))*$
              pattern:
                type: string
                format: regex
  attr:
    type: object
    additionalProperties: false
    properties:
      doc:
        type: string
      required:
        type: boolean
      const:
        type: string
      enum:
        type: array
        minItems: 1
        items:
          type: string
      condition:
        description: true marks the attribute as carrying a condition, checked against conditions.pattern.
        type: boolean
  check:
    type: object
    required:
      - enabled
      - message
    additionalProperties: false
    properties:
      enabled:
        type: boolean
      message:
        type: string
        minLength: 1
      verbs:
        type: array
        minItems: 1
        items:
          type: string
      pattern:
        type: string
        format: regex
      appliesTo:
        description: "File kinds the check runs over. Default: unit only."
        type: array
        minItems: 1
        items:
          enum:
            - unit
            - schema
            - core

  schemaKind:
    type: object
    required:
      - doc
      - match
      - frontmatter
      - document
      - compare
    additionalProperties: false
    properties:
      doc:
        type: string
      match:
        $ref: "#/$defs/match"
      frontmatter:
        type: object
        additionalProperties: false
        properties:
          required:
            type: array
            items:
              type: string
          slug:
            type: array
            items:
              type: string
      compare:
        type: object
        required:
          - descriptionKey
          - stopAtKey
        additionalProperties: false
        properties:
          descriptionKey:
            type: string
          stopAtKey:
            type: string
      document:
        $ref: "#/$defs/documentVocab"
  coreKind:
    type: object
    required:
      - doc
      - match
    additionalProperties: false
    properties:
      doc:
        type: string
      match:
        $ref: "#/$defs/match"
      requireH1:
        type: boolean
      balancedTags:
        type: boolean
      collectBlocks:
        type: boolean
  keyDef:
    description: One key a declared map may carry.
    type: object
    required:
      - type
      - doc
    additionalProperties: false
    properties:
      type:
        enum:
          - string
          - integer
          - boolean
          - list
          - map
      doc:
        type: string
        minLength: 1
      required:
        type: boolean
      enum:
        type: array
        minItems: 1
      format:
        const: regex
      of:
        type: string
        description: Name of the sibling key table each entry follows.
      requires:
        type: object
        description: Other keys that must hold given values for this one to be allowed.
  keyTable:
    description: A named table of keys, used for a repeated sub-map.
    type: object
    required:
      - doc
      - keys
    additionalProperties: false
    properties:
      doc:
        type: string
        minLength: 1
      exactlyOneOf:
        type: array
        minItems: 2
        items:
          type: string
      keys:
        type: object
        minProperties: 1
        patternProperties:
          ^[a-z][a-z-]*$:
            $ref: "#/$defs/keyDef"
        additionalProperties: false
  documentVocab:
    description: What a schema may say about the documents it governs — the analogue of kinds.unit.elements.
    type: object
    required:
      - doc
      - fences
      - fence-marker
      - pattern-dialect
      - keys
      - section
      - preamble
      - frontmatter-constraint
    additionalProperties: false
    properties:
      doc:
        type: string
        minLength: 1
      fences:
        type: integer
        minimum: 1
      fence-marker:
        description: >
          The exact opening marker of a schema's yaml contract. Four backticks, so the example
          the contract carries can hold a three-backtick block without closing it.
        type: string
        pattern: "^`{3,}$"
      pattern-dialect:
        type: string
        minLength: 1
      keys:
        type: object
        minProperties: 1
        patternProperties:
          ^[a-z][a-z-]*$:
            $ref: "#/$defs/keyDef"
        additionalProperties: false
      section:
        $ref: "#/$defs/keyTable"
      preamble:
        $ref: "#/$defs/keyTable"
      frontmatter-constraint:
        $ref: "#/$defs/keyTable"
