[package]
name = "superdev"
description = "superdev command-line tool."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "superdev"
path = "src/main.rs"

[lints.rust]
# `coverage_nightly` is set by cargo-llvm-cov under the nightly coverage job; it
# is an expected cfg, not a typo, on every other toolchain.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[dependencies]
superdev-core.workspace = true
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "io-std", "macros"] }
dialoguer = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
