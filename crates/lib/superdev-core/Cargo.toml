[package]
name = "superdev-core"
description = "Core library for superdev."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
# `coverage_nightly` is set by cargo-llvm-cov under the nightly coverage job; it
# is an expected cfg, not a typo, on every other toolchain.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[dependencies]
model2vec-rs = { workspace = true }
pulldown-cmark = { workspace = true }
regex = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
tantivy = { workspace = true }
toml_edit = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
# `client` drives the MCP server from the in-process integration test; the
# library itself needs only the server half.
rmcp = { workspace = true, features = ["client"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
