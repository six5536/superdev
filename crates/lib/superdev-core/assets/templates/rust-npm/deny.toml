# cargo-deny configuration.
#
# `licenses`, `bans` and `sources` are deterministic — they only fail when we
# change dependencies — so they block CI (checks.yml). `advisories` is
# exogenous and runs on a schedule (audit.yml), opening an issue instead of
# failing an unrelated PR.

[graph]
all-features = true

[licenses]
# Permissive licences only; anything copyleft needs a decision, not a default.
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  # MPL-2.0 is weak, file-level copyleft: obligations attach only to MPL files
  # that are modified and redistributed, so linking it into a binary is fine.
  # Revisit if you ever vendor or patch such a crate.
  "MPL-2.0",
]
confidence-threshold = 0.9
# The allow list is deliberately broader than what the current tree uses, so a
# routine dependency bump does not fail on an unremarkable permissive licence.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
# Enforced by the scheduled audit.yml run, not by CI.
yanked = "warn"
