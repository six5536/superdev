name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to release
        required: true
        type: choice
        options:
          - android
          - ios
          - web
          - all
      track:
        description: Release track
        required: true
        type: choice
        options:
          - beta
          - production
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate ci.yml runs — a release can never ship what CI would fail.
  checks:
    uses: ./.github/workflows/checks.yml

  prepare:
    name: Prepare Release
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Read release manifest
        id: version
        run: |
          echo "version=$(grep '^version:' release/release.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "build_number=$(grep '^build_number:' release/release.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

  android:
    name: Android Release
    needs: prepare
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'all'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
          working-directory: fastlane
      - name: Decode signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
      - name: Build and upload
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/android-native/keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          cd ${{ github.workspace }}
          bundle exec fastlane android_${{ github.event.inputs.track || 'beta' }}

  ios:
    name: iOS Release
    needs: prepare
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'ios' ||
      github.event.inputs.platform == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
          working-directory: fastlane
      - name: Build and upload
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
        run: bundle exec fastlane ios_${{ github.event.inputs.track || 'beta' }}

  web:
    name: Web Release
    needs: prepare
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'web' ||
      github.event.inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
          working-directory: fastlane
      - name: Build and deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: bundle exec fastlane web_deploy
