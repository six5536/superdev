[workspace]
resolver = "2"
members = [
  "crates/app/*",
  "crates/lib/*",
]
# Without this a bare `cargo build` fails with "the workspace has no members".
default-members = ["crates/app/superdev", "crates/lib/superdev-core"]

[workspace.package]
version = "0.1.0"
authors = ["six5536 <10079653+six5536@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.96.0"
readme = "README.md"
license = "MIT"
repository = "https://github.com/six5536/superdev"
homepage = "https://github.com/six5536/superdev"
keywords = ["cli"]
categories = ["command-line-utilities"]

[workspace.dependencies]
# External dependencies (alphabetical)
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
toml_edit = { version = "0.25.13", features = ["serde"] }

# Dev dependencies
assert_cmd = "2.2"
tempfile = "3.27.0"

# Internal crates
superdev-core = { path = "crates/lib/superdev-core", version = "0.1.0" }

# Optimize release builds for size
[profile.release]
opt-level = "z"  # optimize aggressively for size
strip = true  # strip debug info and symbols
lto = true  # full link-time optimization across all crates
panic = "abort"  # no unwinding overhead
codegen-units = 1  # single codegen unit → better optimization

[profile.test]
opt-level = 0
debug = 0
split-debuginfo = "unpacked"  # For macOS
